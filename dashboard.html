<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amori — Tableau de bord (simulation)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--surface:#fff;--text:#1f2a24;--muted:#5d6a62;--lilac:#c9b6e4;--purple:#6b3a85;--line:#e6e0cf;--green:#1f4d3a;--ok:#3d9a4b;--warn:#e8891c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121d;--surface:#241b2e;--text:#f3eef7;--muted:#b9aec6;--line:#3a2d48;--green:#d9c8ef}}
:root[data-theme="dark"]{--bg:#17121d;--surface:#241b2e;--text:#f3eef7;--muted:#b9aec6;--line:#3a2d48;--green:#d9c8ef}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.demo{background:var(--lilac);color:#1f2a24;border-radius:12px;padding:8px 14px;font-size:14px;text-align:center;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;color:var(--green)}
.logo i{width:38px;height:38px;border-radius:50%;background:#f6e27a;display:grid;place-items:center;font-style:normal}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 14px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:9px 18px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
.pad{padding:16px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 20px;border-right:1px solid var(--line)}
.kpi small,h4{color:var(--muted);font-size:12px;letter-spacing:1px;font-weight:500;margin:0}
.kpi b{display:block;font-size:30px;line-height:1.2}
.kpi em{font-style:normal;font-size:13px;color:var(--purple)}
.kpi.r{background:#e8891c1f}.kpi.r b,.kpi.r em{color:var(--warn)}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:10px}
.bars i{flex:1;background:var(--lilac);opacity:.6;border-radius:6px 6px 0 0;min-height:6px}
.bars i.hi{background:var(--purple);opacity:1}
.lab{display:flex;gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:4px}.lab span{flex:1}
.sg{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar u{display:block;height:100%;border-radius:9px;background:var(--ok)}.bar.o u{background:var(--warn)}.bar.p u{background:var(--purple)}
.alert{background:#e8891c1f;color:var(--warn);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:500}
.alert span{display:block;font-weight:400;color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:500;background:var(--purple);color:#fff;border:0;border-radius:99px;padding:9px 18px;cursor:pointer;font-size:14px}
.btn.g{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.cl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.cl:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--lilac);color:#1f2a24;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.cl .m{flex:1;min-width:0;font-size:15px}.cl small{color:var(--muted)}
.pill{font-size:11px;border-radius:99px;padding:1px 9px;margin-left:6px;background:#3d9a4b2e;color:var(--ok)}.pill.o{background:#e8891c2e;color:var(--warn)}.pill.p{background:#6b3a852e;color:var(--purple)}
.sc{min-width:64px;text-align:right;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
input[type=text],textarea,select{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.notif{background:#2a1a3d;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;margin-top:10px}
.notif b{display:block}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}.tg:last-child{border:0}
.tg small{color:var(--muted);display:block}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--purple)}.sw:checked::after{left:21px}
.step{display:flex;align-items:center;gap:12px}.step b{font-size:24px;min-width:30px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:#1f2a24;color:#fff;border-radius:99px;padding:10px 20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
<div class="demo">Simulation interactive avec des données fictives : cliquez, tout fonctionne comme le vrai tableau de bord.</div>
<div class="top">
  <div class="logo"><i>💛</i>Amori · Espace gérant</div>
  <div class="seg" id="per"><button class="on" onclick="setP(7)">7 jours</button><button onclick="setP(30)">30 jours</button></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<div id="toast"></div>
<script>
var F=["Sara","Yasmine","Ayoub","Hamza","Imane","Omar","Nada","Rachid","Salma","Mehdi","Lina","Youssef","Aya","Khadija","Anas","Meryem","Reda","Hajar","Karim","Zineb"];
var max=10,reward="1 boule offerte",period=7,tab="ov",hist=[],auto={a:true,r:true,p:false},aud="all",msgTxt="On vous attend chez Amori 🍦 Votre boule offerte n’est plus très loin !";
var C=[];for(var i=0;i<60;i++){C.push({n:F[i%20]+" "+String.fromCharCode(65+(i*7)%26)+".",s:(i*7)%11,v:(i*5)%9+1,d:(i*13)%50,rw:0,rel:false})}
var TABS=[["ov","📊 Vue d’ensemble"],["cl","👥 Clients"],["ms","💬 Messages"],["st","⚙️ Réglages"]];
function $(i){return document.getElementById(i)}
function act(){return C.filter(function(c){return c.d<=30})}
function risk(){return C.filter(function(c){return c.d>30&&!c.rel})}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";clearTimeout(window._t);window._t=setTimeout(function(){e.className=""},2600)}
function init(c){return c.n.split(" ").map(function(x){return x[0]}).join("")}
function setP(p){period=p;var b=$("per").children;b[0].className=p==7?"on":"";b[1].className=p==30?"on":"";render()}
function go(t){tab=t;render()}
function tabs(){$("tabs").innerHTML=TABS.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+"</button>"}).join("")}
function pill(c){return c.s>=max?'<span class="pill p">Récompense prête</span>':c.d>30?'<span class="pill o">Inactif</span>':'<span class="pill">Actif</span>'}
function row(c,i,btns){return '<div class="cl"><div class="av">'+init(c)+'</div><div class="m"><b>'+c.n+"</b>"+pill(c)+"<br><small>"+c.v+" visites ce mois · dernière : "+(c.d==0?"aujourd’hui":"il y a "+c.d+" j")+'</small></div><div class="sc">'+Math.min(c.s,max)+"/"+max+'<div class="bar p"><u style="width:'+Math.min(100,c.s/max*100)+'%"></u></div></div>'+(btns?'<div class="acts">'+btns+"</div>":"")+"</div>"}
function ov(){
  var a=act(),tot=a.reduce(function(s,c){return s+c.v},0),tp=period==7?Math.round(tot*.28):tot,rk=risk().length;
  var d=period==7?[45,55,50,65,80,100,90]:[62,75,88,100],l=period==7?["L","M","M","J","V","S","D"]:["S1","S2","S3","S4"],hi=period==7?5:3;
  var top=C.slice().sort(function(a,b){return b.v-a.v}).slice(0,4).map(function(c){return row(c,0,"")}).join("");
  return '<div class="card"><div class="kpis"><div class="kpi"><small>CLIENTS</small><b>'+C.length+'</b><em>+12 ce mois</em></div><div class="kpi"><small>TAMPONS</small><b>'+tp+'</b><em>'+(period==7?"7 derniers jours":"30 derniers jours")+'</em></div><div class="kpi"><small>RETOUR</small><b>'+Math.round(a.length/C.length*100)+'%</b><em style="color:var(--ok)">actifs</em></div><div class="kpi r"><small>À RISQUE</small><b>'+rk+'</b><em>à relancer !</em></div></div></div>'+
  '<div class="card pad"><h4>ACTIVITÉ, '+(period==7?"7 DERNIERS JOURS":"4 DERNIÈRES SEMAINES")+'</h4><div class="bars">'+d.map(function(h,i){return '<i class="'+(i==hi?"hi":"")+'" style="height:'+h+'%"></i>'}).join("")+'</div><div class="lab">'+l.map(function(x){return "<span>"+x+"</span>"}).join("")+"</div></div>"+
  '<div class="card"><div class="pad"><h4>SEGMENTATION CLIENTS</h4><div class="sg"><span>Actifs (≤30 j)</span><div class="bar"><u style="width:'+a.length/C.length*100+'%"></u></div><b style="color:var(--ok)">'+a.length+'</b></div><div class="sg"><span>Inactifs (+30 j)</span><div class="bar o"><u style="width:'+(C.length-a.length)/C.length*100+'%"></u></div><b style="color:var(--warn)">'+(C.length-a.length)+"</b></div></div>"+
  (rk?'<div class="alert"><div>⚠️ '+rk+' clients absents depuis +30 jours<span>Envoyez une relance ciblée, ils sont encore récupérables.</span></div><button class="btn" onclick="relance()">Relancer maintenant</button></div>':'<div class="alert" style="color:var(--ok);background:#3d9a4b1f">✅ Tous les clients inactifs ont été relancés.</div>')+"</div>"+
  '<div class="card pad"><h4>MEILLEURS CLIENTS CE MOIS</h4>'+top+"</div>"
}
function cl(){return '<div class="card pad"><div class="row" style="margin-top:0"><input type="text" id="q" placeholder="🔎 Rechercher un client" oninput="list()"><button class="btn" onclick="scan()">📲 Simuler un scan</button></div><div id="lst"></div></div>'}
function list(){var q=($("q")?$("q").value:"").toLowerCase();var r=C.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.s-a.s}).slice(0,10);
  $("lst").innerHTML=r.length?r.map(function(c){var i=C.indexOf(c);return row(c,i,(c.s>=max?'<button class="btn" onclick="give('+i+')">🎁 Offrir</button>':'<button class="btn" onclick="stamp('+i+')">➕ Tampon</button>')+'<button class="btn g" onclick="unst('+i+')">➖</button>')}).join(""):"<p>Aucun client trouvé.</p>"}
function stamp(i){var c=C[i];if(c.s<max){c.s++;c.v++;c.d=0;c.rel=false}toast(c.n+" : "+c.s+"/"+max+(c.s>=max?" 🎉 "+reward+" débloquée":""));list()}
function unst(i){var c=C[i];if(c.s>0){c.s--;toast("Tampon corrigé : "+c.n+" "+c.s+"/"+max)}list()}
function give(i){var c=C[i];c.s=0;c.rw++;toast("🎁 "+reward+" offerte à "+c.n);list()}
function scan(){var c;do{c=Math.floor(Math.random()*C.length)}while(C[c].s>=max);stamp(c)}
function relance(){var n=risk().length;C.forEach(function(c){if(c.d>30)c.rel=true});hist.unshift(["Relance automatique","Inactifs",n]);toast("📨 Relance envoyée à "+n+" clients");render()}
function ms(){var h=hist.length?hist.map(function(x){return '<div class="tg"><div><b>'+x[0]+"</b><small>Audience : "+x[1]+"</small></div><span>"+x[2]+" clients</span></div>"}).join(""):"<small>Aucun message envoyé pour le moment.</small>";
  return '<div class="card pad"><h4>NOUVEAU MESSAGE PUSH</h4><div class="row"><select id="aud" onchange="aud=this.value;prev()"><option value="all">Tous les clients</option><option value="act">Clients actifs</option><option value="ina">Clients inactifs</option></select></div><textarea id="txt" rows="3" oninput="msgTxt=this.value;prev()">'+msgTxt+'</textarea><div class="notif"><b>Amori</b><span id="pv"></span></div><div class="row"><button class="btn" onclick="send()">🚀 Envoyer à <span id="nb"></span> clients</button></div></div>'+
  '<div class="card pad"><h4>AUTOMATISATIONS</h4>'+[["a","🎂 Anniversaire","Double tampon le jour J"],["r","⏰ Relance après 30 jours","Message automatique aux clients absents"],["p","📍 Proximité","Notification quand le client est près de la boutique"]].map(function(t){return '<div class="tg"><div><b>'+t[1]+"</b><small>"+t[2]+'</small></div><input type="checkbox" class="sw" '+(auto[t[0]]?"checked":"")+' onchange="auto.'+t[0]+'=this.checked;toast(this.checked?\'Automatisation activée\':\'Automatisation désactivée\')"></div>'}).join("")+"</div>"+
  '<div class="card pad"><h4>HISTORIQUE</h4>'+h+"</div>"}
function cnt(){return aud=="all"?C.length:aud=="act"?act().length:C.filter(function(c){return c.d>30}).length}
function prev(){$("pv").textContent=msgTxt;$("nb").textContent=cnt()}
function send(){var n=cnt();hist.unshift(["Push manuel",{all:"Tous",act:"Actifs",ina:"Inactifs"}[aud],n]);toast("📨 Message envoyé à "+n+" clients");render()}
function st(){return '<div class="card pad"><h4>MODE DE LA CARTE</h4><div class="row"><button class="btn">🔄 Cyclique</button><button class="btn g" onclick="toast(\'Le mode progressif est disponible sur demande\')">📈 Progressif</button></div></div>'+
  '<div class="card pad"><h4>NOMBRE DE TAMPONS</h4><div class="step"><button class="btn g" onclick="mx(-1)">−</button><b>'+max+'</b><button class="btn g" onclick="mx(1)">+</button><small style="color:var(--muted)">tampons pour obtenir la récompense</small></div></div>'+
  '<div class="card pad"><h4>RÉCOMPENSE</h4><div class="row"><input type="text" value="'+reward+'" oninput="reward=this.value"></div></div>'}
function mx(d){max=Math.max(5,Math.min(15,max+d));C.forEach(function(c){if(c.s>max)c.s=max});render()}
function render(){tabs();$("view").innerHTML={ov:ov,cl:cl,ms:ms,st:st}[tab]();if(tab=="cl")list();if(tab=="ms"){$("aud").value=aud;prev()}}
render();
</script>
</body>
</html>
